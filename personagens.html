<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personagens Capcom</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightslider/1.1.6/css/lightslider.min.css" />
  <link rel="stylesheet" href="style.css">

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightslider/1.1.6/js/lightslider.min.js"></script>
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="./resident.html">Resident Evil</a></li>
        <li><a href="./devilmaycry.html">Devil May Cry</a></li>
        <li><a href="./street.html">Street Fighter</a></li>
        <li><a href="./megaman.html">Mega Man</a></li>
        <li><a href="./monster.html">Monster Hunter</a></li>
        
      </ul>
    </nav>
  </header>

  <div class="container">
    <ul id="autoWidth" class="cs-hidden">
      <li class="item-a">
        <img src="https://upload.wikimedia.org/wikipedia/en/6/6b/Ryu_Street_Fighter.png" alt="Ryu">
      </li><li><a href="./personagens.html" class="ativo">Personagens</a></li>
      <li class="item-a">
        <img src="https://upload.wikimedia.org/wikipedia/en/d/d2/Megaman.png" alt="Mega Man">
      </li>
      <li class="item-a">
        <img src="https://upload.wikimedia.org/wikipedia/en/0/0f/Dante_DMC5.png" alt="Dante">
      </li>
      <li class="item-a">
        <img src="https://upload.wikimedia.org/wikipedia/en/7/7e/Leon_Scott_Kennedy.png" alt="Leon Kennedy">
      </li>
      <li class="item-a">
        <img src="https://upload.wikimedia.org/wikipedia/en/b/b2/Monster_Hunter_Rathalos_Render.png" alt="Rathalos">
      </li>
    </ul>
  </div>

  <script>
    $(document).ready(function () {
      $('#autoWidth').lightSlider({
        autoWidth: true,
        loop: true,
        pause: 3000,
        onSliderLoad: function () {
          $('#autoWidth').removeClass('cs-hidden');
        }
      });
    });
  </script>

  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
    }

    nav ul li {
      margin: 10px 20px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav ul li a:hover,
    .ativo {
      color: #f4c542;
    }

    .container {
      margin-top: 40px;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
    }

    .box img {
      width: 250px;
      height: auto;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    .box img:hover {
      transform: scale(1.05);
    }

    .lSPager.lSpg {
      display: none !important;
    }

    #autoWidth li img {
      width: 220px;
      height: auto;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    #autoWidth li img:hover {
      transform: scale(1.1);
    }
  </style>

</body>

</html>
